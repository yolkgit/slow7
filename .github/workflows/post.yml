name: Slow7 Auto Post

on:
  # GitHub schedule은 1~3시간 지연 문제로 사용 안 함.
  # cron-job.org가 정확한 KST에 workflow_dispatch로 트리거함.
  workflow_dispatch:
    inputs:
      slot:
        description: "수동 실행할 슬롯"
        required: true
        default: "morning"
        type: choice
        options: [morning, noon, evening]

permissions:
  contents: write  # posted_media / DB git push 위해

concurrency:
  group: slow7-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_BRANCH: ${{ github.ref_name }}
      ATTACH_CARD_IMAGE: "false"
      AUTO_REPLY_ENABLED: "true"
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve slot
        id: slot
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
          else
            # KST hour 기준으로 분기 (cron 지연에 강건)
            HOUR_KST=$(TZ="Asia/Seoul" date +%H)
            HOUR_KST=$((10#$HOUR_KST))
            if [ "$HOUR_KST" -ge 5 ] && [ "$HOUR_KST" -lt 11 ]; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            elif [ "$HOUR_KST" -ge 11 ] && [ "$HOUR_KST" -lt 16 ]; then
              echo "slot=noon" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 사람처럼 랜덤 지연 (수동 실행 시 생략)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          DELAY=$((RANDOM % 180))   # 0~3분(180초) 랜덤 — Actions 분 절약
          echo "게시 전 ${DELAY}초 대기 (자연스러운 게시 시각 분산)"
          sleep $DELAY

      - name: Prepare (글 생성)
        run: python -m scripts.post prepare ${{ steps.slot.outputs.slot }}

      - name: Publish to Threads
        run: python -m scripts.post publish

      - name: Commit DB & cleanup
        if: always()
        run: |
          git config user.name "slow7-bot"
          git config user.email "slow7-bot@users.noreply.github.com"
          git add slow7.db || true
          rm -f .pending.json
          git add .pending.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(db): record ${{ steps.slot.outputs.slot }} post"
            git pull --rebase || true
            git push
          fi
