name: Slow7 Growth Bot

# 슬로우조깅/러닝 관련 신규 게시물에 마모루 톤으로 첫 댓글 달기.
# 첫 댓글이 노출의 70%를 결정하는 그로스 엔진.

on:
  schedule:
    # 1시간마다 (다만 매시간 정각은 봇 티나니까 17분에 실행)
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slow7-growth
  cancel-in-progress: true

jobs:
  grow:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Growth pass
        run: python -m scripts.grow

      - name: Commit DB
        if: always()
        run: |
          git config user.name "slow7-bot"
          git config user.email "slow7-bot@users.noreply.github.com"
          git add slow7.db || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(db): growth bot record"
            git pull --rebase || true
            git push
          fi
