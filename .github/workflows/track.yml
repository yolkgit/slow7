name: Slow7 Track Performance

# 본인 게시물 성과(조회/좋아요/답글) 수집 → 토픽별 분석.
# 이 점수가 다음 게시 때 잘되는 토픽을 더 자주 뽑도록 자동 반영됨.

on:
  # 외부 cron(cron-job.org)이 트리거.
  # 매일 00:00 KST 또는 원할 때 수동 실행도 가능.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slow7-track
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect insights & report
        run: python -m scripts.track

      - name: Commit DB
        if: always()
        run: |
          git config user.name "slow7-bot"
          git config user.email "slow7-bot@users.noreply.github.com"
          git add slow7.db || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(db): performance metrics"
            git pull --rebase || true
            git push
          fi
