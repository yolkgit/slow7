name: Slow7 Refresh Long-Lived Token

# Threads의 long-lived 토큰은 60일 유효. 그 안에 refresh 하면 또 60일 갱신.
# 매주 일요일 새벽에 자동 갱신.

on:
  schedule:
    - cron: "0 18 * * 0"   # 매주 일요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
    steps:
      - name: Refresh
        run: |
          set -e
          echo "Refreshing Threads long-lived token..."
          RESP=$(curl -s -G "https://graph.threads.net/refresh_access_token" \
            --data-urlencode "grant_type=th_refresh_token" \
            --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")
          echo "Response: $RESP"
          NEW_TOKEN=$(echo "$RESP" | python -c "import sys, json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$NEW_TOKEN" ]; then
            echo "❌ refresh 실패. 응답: $RESP"
            exit 1
          fi
          echo "::add-mask::$NEW_TOKEN"
          echo "✅ refreshed. 새 토큰을 GitHub Secret THREADS_ACCESS_TOKEN에 직접 갱신해주세요."
          # NOTE: GitHub Secret은 워크플로우에서 직접 쓸 수 없습니다.
          # 갱신된 토큰은 위 로그에 마스킹되어 출력되며, 토큰을 보려면 워크플로우 로그를 다시 다운로드해야 합니다.
          # 자동 업데이트가 필요하면 PAT를 따로 등록해 gh secret set 사용 가능 (가이드 참조).
