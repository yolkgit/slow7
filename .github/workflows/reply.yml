name: Slow7 Auto Reply

on:
  schedule:
    - cron: "23 * * * *"   # 매시간 :23분 (무료 한도 절약 + 정시 회피)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slow7-reply
  cancel-in-progress: true

jobs:
  reply:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      AUTO_REPLY_ENABLED: "true"
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reply pass
        run: python -m scripts.reply

      - name: Commit DB
        if: always()
        run: |
          git config user.name "slow7-bot"
          git config user.email "slow7-bot@users.noreply.github.com"
          git add slow7.db || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(db): replies"
            git pull --rebase || true
            git push
          fi
